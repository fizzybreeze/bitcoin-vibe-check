name: Production Smoke

# Every other gate verifies the code. This one verifies the deployed site —
# real upstreams, no mocks, from a US-hosted runner, which is the exact
# vantage point that would have caught #10 (Binance 451ing US visitors)
# automatically instead of via a hand-run VPN test.
on:
  schedule:
    # Daily, not hourly: BGeometrics' free tier is 15 req/day and /api/chain-data
    # is CDN-cached for 24h, so this costs at most one upstream call regardless
    # of cadence — daily is just the size this needs, not a rate-limit workaround.
    - cron: '43 7 * * *'
  workflow_dispatch:

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke test production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # The browser build, which the runner does not carry. Deliberately **not**
      # `--with-deps`: that shells out to apt, and coupling the one step that
      # must succeed to a package mirror is what took CI down on 18 Aug — three
      # runs in a row hung for the full job timeout inside apt, with
      # `azure.archive.ubuntu.com` unreachable, before a single test body ran.
      - name: Install chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # System libraries, best-effort and bounded — and this is the part worth
      # reading before tightening it. `ubuntu-latest` already ships Chrome, and
      # therefore Chrome's shared libraries, so this is usually a no-op that
      # still pays for an apt round trip. Making it non-fatal is **not**
      # silencing a gate: the gate is the test run below, which is untouched.
      # If these libraries are ever genuinely missing, chromium fails to launch
      # and the suite goes red naming that — which is a far better signal than
      # the job dying in setup having tested nothing.
      #
      # Runs on both paths on purpose: the browser cache covers `~/.cache/
      # ms-playwright` and not system packages, so a cache hit needs them every
      # bit as much as a miss did.
      - name: Install system dependencies
        timeout-minutes: 3
        continue-on-error: true
        run: npx playwright install-deps chromium

      - name: Run smoke test against production
        run: npm run test:smoke

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 14
