name: E2E

# Slower than the unit gate and needs a real browser, so it runs on pull
# requests and on main rather than on every branch push.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # Required: the browser build Playwright expects is not present on the
      # runner, and without this the suite errors out instead of failing
      # meaningfully. Keyed on the Playwright version so the cache invalidates
      # on upgrade.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # The browser build, which the runner does not carry. Deliberately **not**
      # `--with-deps`: that shells out to apt, and coupling the one step that
      # must succeed to a package mirror is what took CI down on 18 Aug — three
      # runs in a row hung for the full job timeout inside apt, with
      # `azure.archive.ubuntu.com` unreachable, before a single test body ran.
      - name: Install chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # System libraries, best-effort and bounded — and this is the part worth
      # reading before tightening it. `ubuntu-latest` already ships Chrome, and
      # therefore Chrome's shared libraries, so this is usually a no-op that
      # still pays for an apt round trip. Making it non-fatal is **not**
      # silencing a gate: the gate is the test run below, which is untouched.
      # If these libraries are ever genuinely missing, chromium fails to launch
      # and the suite goes red naming that — which is a far better signal than
      # the job dying in setup having tested nothing.
      #
      # Runs on both paths on purpose: the browser cache covers `~/.cache/
      # ms-playwright` and not system packages, so a cache hit needs them every
      # bit as much as a miss did.
      - name: Install system dependencies
        timeout-minutes: 3
        continue-on-error: true
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      # On failure this is the artifact that makes a red check debuggable from
      # a phone: screenshots and traces, no laptop required.
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Uploaded separately from the report so that reviewing a *green* run is
      # one tap. The same image is attached inside playwright-report, but
      # finding it there means downloading and unpacking the whole bundle —
      # which is exactly the friction this is meant to remove.
      - name: Upload mobile screenshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: mobile-screenshot
          path: mobile-screenshots/
          retention-days: 14
          if-no-files-found: error
