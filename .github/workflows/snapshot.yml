name: Daily Snapshot

on:
  schedule:
    # 06:00 UTC daily. Deliberately not on the hour boundary that every other
    # scheduled job on GitHub uses, to avoid the busiest queue window.
    - cron: '17 6 * * *'
  # Lets you trigger a run by hand from the GitHub mobile app — the thing the
  # old Proxmox cron could never do.
  workflow_dispatch:

# Never let two snapshot runs overlap; the later one wins.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Capture metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Capture snapshot
        run: node scripts/snapshot.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BGEOMETRICS_API_KEY: ${{ secrets.BGEOMETRICS_API_KEY }}

      # Composed from the rows just written, so the draft and the permanent
      # record cannot disagree. Nothing is sent: there is no beehiiv credential
      # in this job, which is what keeps the human in the send loop structural
      # rather than a policy.
      #
      # Runs even when the capture failed (`!cancelled()`, the same guard the
      # e2e artifacts use): a failed capture still leaves
      # yesterday's row, and a draft with a "this is not today's data" banner on
      # it is more use than no step at all. The banner is `buildNewsletterDraft`'s
      # job, from the `asOf` it is given.
      - name: Draft the newsletter
        if: ${{ !cancelled() }}
        run: node scripts/newsletter-draft.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Publishes the day's vibe to Nostr. Guarded rather than unconditional:
      # `shouldPublish` refuses a stale snapshot, an unscoreable day, and a 24h
      # move past ±10% — the crash case, where a cheerful scheduled post reads
      # worst. The guard's reason lands in this run's summary either way.
      #
      # **The kill switch is the secret.** With no NOSTR_PRIVATE_KEY this is a
      # dry run that prints the post and sends nothing, so switching it off is
      # deleting one secret and switching it on the first time is reviewable.
      - name: Post the daily vibe
        if: ${{ !cancelled() }}
        run: node scripts/nostr-post.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOSTR_PRIVATE_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}

      # The copy-paste path. The step summary above is the one you read on a
      # phone; this is the one you paste into beehiiv.
      - name: Upload the draft
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: newsletter-draft
          path: newsletter-draft.md
          if-no-files-found: ignore
          retention-days: 30
