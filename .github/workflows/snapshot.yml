name: Daily Snapshot

on:
  schedule:
    # 06:00 UTC daily. Deliberately not on the hour boundary that every other
    # scheduled job on GitHub uses, to avoid the busiest queue window.
    - cron: '17 6 * * *'
  # Lets you trigger a run by hand from the GitHub mobile app — the thing the
  # old Proxmox cron could never do.
  workflow_dispatch:
    inputs:
      draft_newsletter:
        description: 'Compose the weekly brief even if today is not the publishing day'
        type: boolean
        default: false
      newsletter_issue:
        description: 'Issue number for the brief (blank leaves it off the subject line)'
        type: string
        required: false

# Never let two snapshot runs overlap; the later one wins.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Capture metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Capture snapshot
        run: node scripts/snapshot.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BGEOMETRICS_API_KEY: ${{ secrets.BGEOMETRICS_API_KEY }}

      # Composed from the rows just written, so the brief and the permanent
      # record cannot disagree. Nothing is sent: there is no beehiiv credential
      # in this job, which is what keeps the human in the send loop structural
      # rather than a policy.
      #
      # **The brief is weekly and this step is daily on purpose.** It needs the
      # day's capture to exist, and GitHub's scheduler drifts by hours — the cron
      # above asks for 06:17 and its scheduled runs start nearer 09:10 — so a
      # separate weekly workflow would have to guess a time late enough to be
      # after this one. Running here makes the ordering structural; `shouldDraft`
      # returns early on the six days that are not the publishing day, and says
      # so in the log rather than exiting silently.
      #
      # Runs even when the capture failed (`!cancelled()`, the same guard the
      # e2e artifacts use): a failed capture still leaves last week's rows, and a
      # brief with a "this is not this week's data" banner on it is more use than
      # no step at all. The banner is `buildNewsletterDraft`'s job, from the
      # `asOf` it is given.
      - name: Draft the weekly brief
        if: ${{ !cancelled() }}
        run: node scripts/newsletter-draft.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWSLETTER_FORCE: ${{ inputs.draft_newsletter }}
          NEWSLETTER_ISSUE: ${{ inputs.newsletter_issue }}

      # Publishes the day's vibe to Nostr. Guarded rather than unconditional:
      # `shouldPublish` refuses a stale snapshot, an unscoreable day, and a 24h
      # move past ±10% — the crash case, where a cheerful scheduled post reads
      # worst. The guard's reason lands in this run's summary either way.
      #
      # **The kill switch is the secret.** With no NOSTR_PRIVATE_KEY this is a
      # dry run that prints the post and sends nothing, so switching it off is
      # deleting one secret and switching it on the first time is reviewable.
      - name: Post the daily vibe
        if: ${{ !cancelled() }}
        run: node scripts/nostr-post.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOSTR_PRIVATE_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}

      # The copy-paste path. The step summary above is the one you read on a
      # phone; this is the one you paste into beehiiv. `if-no-files-found:
      # ignore` is what makes a weekly artifact out of a daily step — on the six
      # non-publishing days there is no file and no failure.
      - name: Upload the brief
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: weekly-brief
          path: weekly-brief.md
          if-no-files-found: ignore
          retention-days: 90
