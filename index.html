<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var stored = localStorage.getItem('btc-theme');
        if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores the manifest's icons entirely. Without this, adding the
         site to the home screen uses a screenshot of the page. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="description" content="Bitcoin's mood, money, and mempool. Read the room." />

    <!-- Open Graph -->
    <meta property="og:title" content="Bitcoin Vibe Check — Real-Time Bitcoin Dashboard" />
    <meta property="og:description" content="Bitcoin Vibe Check is a real-time Bitcoin dashboard showing live price, Fear &amp; Greed index, mempool fees, network health, and the halving countdown. Read the room." />
    <!--
      /og-live.png rewrites to the api/og function, which renders the current
      price, Vibe Score and Fear & Greed at request time. The path is stable and
      ends in .png on purpose: some unfurlers key their cache on the URL and some
      only trust an image-looking one. If the function fails it redirects to
      /og-image.png, the static card that used to be here.
    -->
    <meta property="og:image" content="https://bitcoinvibecheck.com/og-live.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bitcoin Vibe Check — live BTC price, Vibe Score and Fear &amp; Greed index" />
    <meta property="og:url" content="https://bitcoinvibecheck.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bitcoin Vibe Check" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bitcoin Vibe Check — Real-Time Bitcoin Dashboard" />
    <meta name="twitter:description" content="Bitcoin Vibe Check is a real-time Bitcoin dashboard showing live price, Fear &amp; Greed index, mempool fees, network health, and the halving countdown. Read the room." />
    <meta name="twitter:image" content="https://bitcoinvibecheck.com/og-live.png" />
    <meta name="twitter:image:alt" content="Bitcoin Vibe Check — live BTC price, Vibe Score and Fear &amp; Greed index" />
    <meta name="twitter:site" content="@BitcoinVibeCheck" />
