<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- iOS ignores the manifest's icons entirely. Without this, adding the
         site to the home screen uses a screenshot of the page. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- The dark ground. Rewritten to the light one by the boot script below
         when that is the active theme, and kept in step by `useTheme`. -->
    <meta name="theme-color" content="#12101c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!--
      Theme, applied before the first paint.

      This has to be an inline blocking script rather than anything React does:
      the stylesheet's light values are the base and `.dark` overrides them, so
      a dark-theme visitor whose class arrives with the bundle would see a white
      page flash first. That flash is the most obvious way a themed site looks
      broken, and this is the only place it can be prevented.

      It sits *after* the `theme-color` meta on purpose — it rewrites that tag,
      and an element that has not been parsed yet cannot be selected. Being
      lower in `<head>` costs nothing: any blocking script here still runs
      before the first paint.

      No stored preference means follow the operating system. `localStorage`
      throws in Safari's private mode, so the read is guarded — an uncaught
      exception here would abort the script and take the theme with it.

      `useTheme` re-applies all of this on mount and owns it from then on. The
      two agree because both read `btc-theme`, both treat anything unrecognised
      as no preference, and `palette.test.js` pins the two colours below to the
      palette so this copy cannot drift from it.
    -->
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('btc-theme'); } catch (e) { /* storage disabled */ }
        var dark = stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#12101c' : '#faf7fc');
      })();
    </script>
    <meta name="description" content="Bitcoin's mood, money, and mempool. Read the room." />

    <!-- Open Graph -->
    <meta property="og:title" content="Bitcoin Vibe Check — Real-Time Bitcoin Dashboard" />
    <meta property="og:description" content="Bitcoin Vibe Check is a real-time Bitcoin dashboard showing live price, Fear &amp; Greed index, mempool fees, network health, and the halving countdown. Read the room." />
    <!--
      /og-live.png rewrites to the api/og function, which renders the current
      price, Vibe Score and Fear & Greed at request time. The path is stable and
      ends in .png on purpose: some unfurlers key their cache on the URL and some
      only trust an image-looking one. If the function fails it redirects to
      /og-image.png, the static card that used to be here.
    -->
    <meta property="og:image" content="https://bitcoinvibecheck.com/og-live.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bitcoin Vibe Check — live BTC price, Vibe Score and Fear &amp; Greed index" />
    <meta property="og:url" content="https://bitcoinvibecheck.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bitcoin Vibe Check" />
